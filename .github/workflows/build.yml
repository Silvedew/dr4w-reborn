name: build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Compile dylib (arm64 + arm64e)
        run: |
          set -euxo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SRCS=$(find Engine Reborn -name '*.m')
          echo "$SRCS"
          COMMON="-isysroot $SDK -miphoneos-version-min=15.0 -fobjc-arc -O2 -IEngine -IReborn -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore"
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0  $COMMON -dynamiclib $SRCS -o Dr4wReborn-arm64.dylib
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 $COMMON -dynamiclib $SRCS -o Dr4wReborn-arm64e.dylib
          lipo -create Dr4wReborn-arm64.dylib Dr4wReborn-arm64e.dylib -output Dr4wReborn.dylib
          lipo -info Dr4wReborn.dylib

      - name: Package deb
        run: |
          set -euxo pipefail
          brew install ldid dpkg
          VER="0.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          mkdir -p pkg/DEBIAN pkg/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp Dr4wReborn.dylib Dr4wReborn.plist pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp control pkg/DEBIAN/control
          sed -i '' "s/^Version:.*/Version: ${VER}/" pkg/DEBIAN/control
          grep -a '^Version' pkg/DEBIAN/control
          ldid -S pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/Dr4wReborn.dylib
          dpkg-deb --build --root-owner-group pkg "Dr4wReborn_${VER}_iphoneos-arm64.deb"
          ls -l Dr4wReborn_*.deb

      - name: Publish release (raw .deb)
        run: |
          set -euxo pipefail
          gh release create "build-${GITHUB_RUN_NUMBER}" Dr4wReborn_*.deb \
            --title "Dr4w Reborn ${VERSION}" \
            --notes "自动构建 ${VERSION}（${GITHUB_SHA}）" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Dr4wReborn-deb
          path: Dr4wReborn_*.deb
