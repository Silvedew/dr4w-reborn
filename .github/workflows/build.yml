name: build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Performance regression guards
        run: node --test tests/performance.test.cjs

      - name: Activation and settings behavior tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -IShared tests/policy_test.c -o /tmp/rb-policy-tests
          /tmp/rb-policy-tests
          clang -std=c11 -Wall -Wextra -Werror -IShared tests/toolbar_layout_test.c -o /tmp/rb-toolbar-tests
          /tmp/rb-toolbar-tests
          clang -std=c11 -Wall -Wextra -Werror -IShared tests/stroke_width_test.c -o /tmp/rb-width-tests
          /tmp/rb-width-tests
          clang -std=c11 -Wall -Wextra -Werror -IShared tests/brush_layout_test.c -o /tmp/rb-brush-tests
          /tmp/rb-brush-tests
          clang -fobjc-arc -Itests/stubs -IShared -framework Foundation -framework CoreFoundation tests/SettingsTests.m tests/FakeHBPreferences.m -o /tmp/rb-settings-tests
          /tmp/rb-settings-tests
          clang -fobjc-arc -Itests/stubs -IShared -framework Foundation -framework CoreFoundation tests/PreferencesControllerTests.m tests/FakeHBPreferences.m -o /tmp/rb-controller-tests
          /tmp/rb-controller-tests
          clang -fobjc-arc -Itests/stubs -IShared -framework Foundation -framework CoreFoundation tests/SettingsBridgeTests.m tests/FakeHBPreferences.m -o /tmp/rb-bridge-tests
          /tmp/rb-bridge-tests
          plutil -lint Dr4wReborn.plist Preferences/Info.plist Preferences/Dr4wReborn.plist

      - name: Render and verify Settings icons
        run: swift scripts/generate-settings-icons.swift settings-icons

      - name: Show SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Download pinned official Cephei 2.0 SDK
        run: |
          mkdir -p .deps/cephei
          curl --fail --location --retry 3 https://github.com/hbang/libcephei/releases/download/2.0/cephei_sdk_2.0.zip -o .deps/cephei/sdk.zip
          echo '665758f996b333e8e58594af9950fc8e3ffe7c3c4078f49f66cadeaa162ef154  .deps/cephei/sdk.zip' | shasum -a 256 --check
          unzip -q .deps/cephei/sdk.zip -d .deps/cephei

      - name: Compile dylib (arm64 + arm64e)
        run: |
          set -euxo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SRCS=$(find Engine Reborn Shared -name '*.m')
          echo "$SRCS"
          COMMON=(-isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -O2 -IEngine -IReborn -IShared -F "$PWD/.deps/cephei/cephei_sdk_2.0" -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore -framework Cephei -Wl,-rpath,/var/jb/Library/Frameworks "-DRB_BUILD_VERSION=\"0.1.${GITHUB_RUN_NUMBER}\"")
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 "${COMMON[@]}" -dynamiclib $SRCS -o Dr4wReborn-arm64.dylib
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 "${COMMON[@]}" -dynamiclib $SRCS -o Dr4wReborn-arm64e.dylib
          lipo -create Dr4wReborn-arm64.dylib Dr4wReborn-arm64e.dylib -output Dr4wReborn.dylib
          lipo -info Dr4wReborn.dylib

      - name: Compile Settings bundle (arm64 + arm64e)
        run: |
          set -euxo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          COMMON=(-isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -O2 -IShared -F "$PWD/.deps/cephei/cephei_sdk_2.0" -framework Foundation -framework UIKit -framework MobileCoreServices -framework Cephei -Wl,-rpath,/var/jb/Library/Frameworks -dynamiclib -undefined dynamic_lookup -install_name /var/jb/Library/PreferenceBundles/Dr4wRebornPrefs.bundle/Dr4wRebornPrefs)
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 "${COMMON[@]}" Preferences/RBRootListController.m Shared/RBSettingsStore.m -o Prefs-arm64
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 "${COMMON[@]}" Preferences/RBRootListController.m Shared/RBSettingsStore.m -o Prefs-arm64e
          lipo -create Prefs-arm64 Prefs-arm64e -output Dr4wRebornPrefs

      - name: Verify Cephei dependencies and rootless search paths
        run: |
          set -euxo pipefail
          for binary in Dr4wReborn-arm64.dylib Dr4wReborn-arm64e.dylib Prefs-arm64 Prefs-arm64e; do
            otool -L "$binary" | grep -F '@rpath/Cephei.framework/Cephei'
            otool -l "$binary" | grep -F 'path /var/jb/Library/Frameworks'
          done

      - name: Package deb
        run: |
          set -euxo pipefail
          brew install ldid dpkg
          VER="0.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          mkdir -p pkg/DEBIAN pkg/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp Dr4wReborn.dylib Dr4wReborn.plist pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp control pkg/DEBIAN/control
          mkdir -p pkg/var/jb/Library/PreferenceBundles/Dr4wRebornPrefs.bundle pkg/var/jb/Library/PreferenceLoader/Preferences
          cp Dr4wRebornPrefs Preferences/Info.plist pkg/var/jb/Library/PreferenceBundles/Dr4wRebornPrefs.bundle/
          cp Preferences/Dr4wReborn.plist pkg/var/jb/Library/PreferenceLoader/Preferences/
          cp settings-icons/Dr4wReborn*.png pkg/var/jb/Library/PreferenceLoader/Preferences/
          sed -i '' "s/^Version:.*/Version: ${VER}/" pkg/DEBIAN/control
          grep -a '^Version' pkg/DEBIAN/control
          ldid -S pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/Dr4wReborn.dylib
          ldid -S pkg/var/jb/Library/PreferenceBundles/Dr4wRebornPrefs.bundle/Dr4wRebornPrefs
          dpkg-deb --build --root-owner-group pkg "Dr4wReborn_${VER}_iphoneos-arm64.deb"
          ls -l Dr4wReborn_*.deb

      - name: Publish release (raw .deb)
        run: |
          set -euxo pipefail
          gh release create "build-${GITHUB_RUN_NUMBER}" Dr4wReborn_*.deb \
            --title "Dr4w Reborn ${VERSION}" \
            --notes "自动构建 ${VERSION}（${GITHUB_SHA}）" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Sileo repo (gh-pages)
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site
          cp Dr4wReborn_*.deb site/
          DEB=$(basename "$(ls site/*.deb | head -1)")
          SIZE=$(stat -f%z "site/$DEB")
          MD5=$(md5 -q "site/$DEB")
          SHA=$(shasum -a 256 "site/$DEB" | awk '{print $1}')

          OWNER=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=${GITHUB_REPOSITORY##*/}
          BASE="https://${OWNER}.github.io/${REPO_NAME}"

          printf 'Package: com.dsh.dr4wreborn\nName: 全局画板\nVersion: %s\nArchitecture: iphoneos-arm64\nDescription: 全局画板 —— 任意界面手绘标注，开源可改\nMaintainer: dsh\nAuthor: dsh\nSection: Tweaks\nDepends: mobilesubstrate | ellekit, preferenceloader, ws.hbang.common (>= 2.0)\nFilename: %s/%s\nSize: %s\nMD5sum: %s\nSHA256: %s\n\n' \
            "${VERSION}" "${BASE}" "${DEB}" "${SIZE}" "${MD5}" "${SHA}" > site/Packages
          gzip -c site/Packages > site/Packages.gz

          printf 'Origin: Dr4wReborn\nLabel: 全局画板\nSuite: stable\nVersion: 1.0\nCodename: ios\nArchitectures: iphoneos-arm64\nComponents: main\nDescription: 全局画板 自建源\n' > site/Release

          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name=actions -c user.email=actions@github.com commit -qm "build ${VERSION}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Dr4wReborn-deb
          path: Dr4wReborn_*.deb
